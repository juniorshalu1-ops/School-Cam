name: Build SchoolCam Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SchoolCam_Bihar_by_Satyam.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolCam-Android-APK
          path: |
            SchoolCam_Bihar_by_Satyam.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
